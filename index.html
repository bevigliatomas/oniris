  :root {
    --rojo:    #CA2318;
    --amarillo:#F5B01A;
    --violeta: #712556;
    --negro:   #151515;
    --blanco:  #EAE2D8;
    --titulo:  'Velodroma', 'Arial Black', sans-serif;
    --mono:    'Space Mono', monospace;
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--negro);
    color: var(--blanco);
    font-family: var(--mono);
    cursor: crosshair;
  }

  /* GRAIN fijo */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 9999;
    opacity: 0.4;
  }

  /* PANTALLA ÚNICA */
  .screen {
    width: 100vw; height: 100vh;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3.5rem;
    overflow: hidden;
  }

  }

  /* velo suave para que el contenido respire */
  .screen::after {
    content: '';
    position: absolute; inset: 0;
    background: rgba(21, 21, 21, 0.35);
    z-index: 1;
  }

  /* LOGO */
  .logo-wrap {
    position: relative; z-index: 2;
  }
  .logo-wrap img {
    width: clamp(200px, 38vw, 520px);
    display: block;
    
  }

  /* CUENTA REGRESIVA */
  .countdown {
    position: relative; z-index: 2;
    display: flex;
    align-items: flex-start;
    gap: clamp(1rem, 4vw, 3.5rem);
  }

  .cd-unit {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }

  /* separador : entre unidades */
  .cd-sep {
    font-family: var(--titulo);
    font-size: clamp(3.5rem, 11vw, 9rem);
    font-weight: 400;
    line-height: 0.9;
    color: var(--rojo);
    align-self: center;
    padding-bottom: 1.4rem; /* compensa el label de abajo para centrarse con los números */
  }

  .cd-num {
    display: block;
    font-family: var(--titulo);
    font-size: clamp(3.5rem, 11vw, 9rem);
    font-weight: 400;
    line-height: 0.9;
    color: var(--blanco);
    position: relative;
    letter-spacing: -0.02em;
  }

  /* sombra de offset en rojo */
  .cd-num::before {
    content: attr(data-val);
    position: absolute; inset: 0;
    color: var(--rojo);
    transform: translate(3px, 3px);
    z-index: -1;
    opacity: 0.55;
  }

  .cd-name {
    display: block;
    font-family: var(--mono);
    font-size: clamp(0.5rem, 1vw, 0.7rem);
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--amarillo);
    margin-top: 0.6rem;
  }

  /* pulso al cambiar segundo */
  @keyframes pulse-num {
    0%   { color: var(--amarillo); }
    100% { color: var(--blanco); }
  }
  .cd-num.tick { animation: pulse-num 0.35s ease forwards; }

  /* RESPONSIVE mobile */
  @media (max-width: 520px) {
    .screen { gap: 2.5rem; }
    .cd-unit:not(:last-child)::after { right: -0.7rem; font-size: clamp(1.8rem, 7vw, 3rem); }
  }
</style>

  <div class="countdown" id="countdown">
    <div class="cd-unit">
      <span class="cd-num" id="cd-days" data-val="07">07</span>
      <span class="cd-name">días</span>
    </div>
    <span class="cd-sep">:</span>
    <div class="cd-unit">
      <span class="cd-num" id="cd-hours" data-val="05">05</span>
      <span class="cd-name">horas</span>
    </div>
    <span class="cd-sep">:</span>
    <div class="cd-unit">
      <span class="cd-num" id="cd-mins" data-val="03">03</span>
      <span class="cd-name">min</span>
    </div>
    <span class="cd-sep">:</span>
    <div class="cd-unit">
      <span class="cd-num" id="cd-secs" data-val="20">20</span>
      <span class="cd-name">seg</span>
    </div>
  </div>
</div>

<script>
  const now    = new Date();
  const target = new Date(
    now.getTime() +
    (7 * 24 * 60 * 60 + 5 * 60 * 60 + 3 * 60 + 20) * 1000
  );

  function pad(n) { return String(n).padStart(2, '0'); }

  function tick() {
    const diff  = Math.max(0, target - Date.now());
    const days  = Math.floor(diff / 86400000);
    const hours = Math.floor((diff % 86400000) / 3600000);
    const mins  = Math.floor((diff % 3600000)  / 60000);
    const secs  = Math.floor((diff % 60000)    / 1000);

    const sEl = document.getElementById('cd-secs');
    const newSec = pad(secs);
    if (sEl.textContent !== newSec) {
      sEl.classList.remove('tick');
      void sEl.offsetWidth;
      sEl.classList.add('tick');
    }

    document.getElementById('cd-days').textContent  = pad(days);
    document.getElementById('cd-days').setAttribute('data-val', pad(days));
    document.getElementById('cd-hours').textContent = pad(hours);
    document.getElementById('cd-hours').setAttribute('data-val', pad(hours));
    document.getElementById('cd-mins').textContent  = pad(mins);
    document.getElementById('cd-mins').setAttribute('data-val', pad(mins));
    sEl.textContent = newSec;
    sEl.setAttribute('data-val', newSec);
  }

  tick();
  setInterval(tick, 1000);
</script>
